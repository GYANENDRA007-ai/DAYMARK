name: KAAM Android build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kaam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Verify source and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Run offline regression checks
        shell: bash
        run: python3 tools/verify_kaam_offline.py

      - name: Build Android debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kaam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaam-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14
