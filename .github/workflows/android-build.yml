name: KAAM Android build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kaam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Verify source and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Move project root files out of pri_test
        shell: bash
        run: |
          set -eu
          for f in build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat BUILDING_KAAM_WINDOWS.md KAAM_DEVICE_ACCEPTANCE_CHECKLIST_v25.md; do
            if [ ! -e "$f" ] && [ -e "pri_test/$f" ]; then cp "pri_test/$f" "$f"; fi
          done
          chmod +x ./gradlew

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          # Packages that are not listed on this runner are skipped; Gradle downloads what it needs.
          "$SDKM" --install 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0' || echo "Some SDK packages not listed; Gradle will fetch them."

      - name: Make sure PyYAML is available
        shell: bash
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml

      - name: Run offline regression checks
        shell: bash
        run: python3 tools/verify_kaam_offline.py

      - name: Build Android debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kaam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaam-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14
